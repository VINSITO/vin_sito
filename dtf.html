<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SitoVIN - DTF štampa: savremena tehnika za složene dizajne sa neograničenim brojem boja.">
<title>SitoVIN | DTF Štampa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Poppins',sans-serif;background:#0f0f0f;color:#fff;line-height:1.6;font-size:16px}

/* ---------- HEADER / MENI ---------- */
header{background:#000;padding:15px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(255,204,0,0.2)}
.logo{font-size:28px;font-weight:800;color:#fff;white-space:nowrap}
.logo span{color:#ffcc00}

.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:30px;line-height:1;cursor:pointer;padding:4px 10px;font-family:inherit}
.menu-toggle:hover{color:#ffcc00}

nav{display:flex;align-items:center;justify-content:center;gap:30px;flex:1}

nav a,
.dropdown-btn{
  font-family:'Poppins',sans-serif;
  font-size:16px;
  font-weight:500;
  line-height:1.6;
  color:#fff;
  text-decoration:none;
  transition:0.3s;
}
nav a:hover,
.dropdown-btn:hover{color:#ffcc00}
nav a.active{color:#ffcc00}

.dropdown{position:relative}
.dropdown-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0}

.dropdown-content{display:none;position:absolute;top:100%;left:0;min-width:250px;background:#1c1c1c;box-shadow:0 8px 16px rgba(0,0,0,0.5);padding:10px 0;border-radius:8px;border:1px solid #ffcc00;z-index:1100}
.dropdown-content a{display:block;padding:12px 20px;white-space:nowrap}
.dropdown-content a:hover{background:#2a2a2a;color:#ffcc00;padding-left:25px}

.dropdown.open .dropdown-content{display:block}
@media (hover:hover) and (min-width:901px){
  .dropdown:hover .dropdown-content{display:block}
}

/* ---------- SADRŽAJ ---------- */
.page-hero{padding:80px 40px 50px;text-align:center;background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.95)),url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64');background-size:cover;background-position:center}
.page-hero h1{font-size:42px;font-weight:800;color:#ffcc00;margin-bottom:15px;animation:fadeInDown 0.8s}
.page-hero p{font-size:18px;color:#ccc;max-width:650px;margin:auto;animation:fadeInUp 0.8s}
section{padding:60px 40px;max-width:900px;margin:auto}
section h2{text-align:center;margin-bottom:40px;font-size:36px;color:#ffcc00}
.content-box{background:#1c1c1c;padding:40px;border-radius:15px;border-left:4px solid #ffcc00;margin-bottom:30px}
.content-box p{color:#ccc;font-size:16px;line-height:1.9;margin-bottom:15px}
.advantages{background:#1c1c1c;padding:40px;border-radius:15px;border-left:4px solid #ffcc00;margin-bottom:30px}
.advantages h3{color:#ffcc00;font-size:20px;margin-bottom:20px}
.advantages ul{list-style:none;padding:0}
.advantages ul li{color:#ccc;padding:10px 0;border-bottom:1px solid #2a2a2a;font-size:15px}
.advantages ul li:last-child{border-bottom:none}
.advantages ul li::before{content:'✓ ';color:#ffcc00;font-weight:700}
.contact-info{background:#1c1c1c;padding:40px;border-radius:15px;margin:30px 0;border-left:4px solid #ffcc00}
.contact-info h3{color:#ffcc00;margin-bottom:20px}
.contact-info p{margin:15px 0;font-size:16px}
.contact-info a{color:#ffcc00;text-decoration:none;font-weight:600}
.contact-info a:hover{text-decoration:underline}
iframe{width:100%;height:400px;border:0;border-radius:15px;margin-top:30px}
footer{background:#000;text-align:center;padding:30px;font-size:14px;margin-top:50px;border-top:1px solid #ffcc00}
footer a{color:#ffcc00;text-decoration:none}

@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ---------- TELEFON / TABLET ---------- */
@media (max-width:900px){
  header{padding:12px 20px;flex-wrap:wrap}
  .logo{font-size:24px}
  .menu-toggle{display:block}

  nav{
    display:none;
    width:100%;
    flex:none;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:0;
    margin-top:10px;
    border-top:1px solid #333;
  }
  nav.open{display:flex}

  nav > a,
  .dropdown-btn{
    width:100%;
    justify-content:center;
    text-align:center;
    padding:14px 0;
  }

  .dropdown{width:100%}
  .dropdown-content{
    position:static;
    min-width:0;
    width:100%;
    box-shadow:none;
    border:none;
    border-radius:0;
    background:#111;
    padding:0;
  }
  .dropdown-content a{text-align:center;padding:12px 20px;white-space:normal}
  .dropdown-content a:hover{padding-left:20px}

  .page-hero{padding:50px 20px 35px}
  .page-hero h1{font-size:28px}
  .page-hero p{font-size:16px}
  section{padding:40px 20px}
  section h2{font-size:28px;margin-bottom:30px}
  .content-box,.advantages,.contact-info{padding:25px}
}
</style>
</head>
<body>

<header>
  <a href="index.html" style="text-decoration:none"><div
